[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gw-instek-asr-3000"
description = "Unofficial Python driver for the GW Instek ASR-3000 series (ASR-3200/3300/3400/3400HF) programmable AC/DC power source"
readme = "README.md"
requires-python = ">=3.10"
license = "0BSD"
license-files = ["LICENSE"]
authors = [{ name = "GW Instek ASR driver contributors" }]
keywords = [
    "gw-instek",
    "gw instek",
    "asr-3000",
    "asr-3300",
    "ac/dc power source",
    "scpi",
    "instrument",
    "lab",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: System :: Hardware",
]
dynamic = ["version"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.6.9",
    "mypy>=1.11",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocstrings[python]>=0.27,<1",
    "mkdocs-gen-files>=0.5,<1",
]

[project.urls]
Homepage = "https://github.com/fuubox/gw-instek-asr-3000"
Documentation = "https://github.com/fuubox/gw-instek-asr-3000#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "gw_instek_asr.__version__" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: requires a physical ASR-3000 connected over Ethernet",
]

[tool.ruff]
target-version = "py310"
line-length = 130
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.10"
files = ["src/gw_instek_asr"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_return_any = false
warn_unused_ignores = true
